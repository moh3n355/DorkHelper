<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dorker.sh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#120d09;
    --panel:#1b140d;
    --panel-2:#221a11;
    --hairline:#3a2c1a;
    --amber:#ffb000;
    --amber-dim:#a87a2e;
    --teal:#4fd1c5;
    --text:#f0e6d2;
    --text-dim:#8a7a5c;
    --red:#ff5f56;
    --yellow:#ffbd2e;
    --green:#27c93f;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #2a1f12 0%, var(--void) 55%),
      var(--void);
    color:var(--text);
    font-family:'JetBrains Mono', ui-monospace, monospace;
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index:50;
  }

  .crt{
    width:100%;
    max-width:860px;
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:10px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.4),
      0 40px 80px -20px rgba(0,0,0,0.7),
      0 0 120px -40px rgba(255,176,0,0.15);
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    background:var(--panel-2);
    border-bottom:1px solid var(--hairline);
  }

  .dot{ width:11px; height:11px; border-radius:50%; }
  .dot.r{ background:var(--red); }
  .dot.y{ background:var(--yellow); }
  .dot.g{ background:var(--green); }

  .titlebar .name{
    margin-left:8px;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:0.03em;
  }
  .titlebar .name b{ color:var(--text); font-weight:600; }

  .titlebar .badge{
    margin-left:auto;
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--amber-dim);
    border:1px solid var(--hairline);
    padding:3px 8px;
    border-radius:4px;
  }

  .screen{ padding:26px 26px 20px; }

  .banner{
    color:var(--amber-dim);
    font-size:11px;
    line-height:1.5;
    white-space:pre;
    margin-bottom:18px;
    opacity:0.85;
    overflow-x:auto;
  }

  .prompt-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding-bottom:16px;
    border-bottom:1px solid var(--hairline);
    margin-bottom:16px;
  }

  .prompt-label{
    color:var(--green);
    font-size:14px;
    white-space:nowrap;
  }
  .prompt-label .path{ color:var(--teal); }
  .prompt-label .sym{ color:var(--text-dim); }

  .input-wrap{
    flex:1;
    display:flex;
    align-items:center;
    background:var(--void);
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:8px 12px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap:focus-within{
    border-color:var(--amber-dim);
    box-shadow:0 0 0 3px rgba(255,176,0,0.08);
  }

  #domain{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--amber);
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  #domain::placeholder{ color:var(--text-dim); font-weight:400; }

  .cursor{
    display:inline-block;
    width:8px; height:16px;
    background:var(--amber);
    margin-left:2px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
  }
  .meta-row .count b{ color:var(--teal); font-weight:600; }

  .results{
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--hairline);
  }

  .line{
    display:flex;
    gap:14px;
    padding:9px 4px;
    border-bottom:1px solid var(--hairline);
    text-decoration:none;
    font-size:13px;
    line-height:1.55;
    transition:background .12s ease, padding-left .12s ease;
  }
  .line:hover{
    background:rgba(255,176,0,0.05);
    padding-left:8px;
  }

  .ln{
    color:var(--text-dim);
    opacity:0.5;
    min-width:20px;
    text-align:right;
    user-select:none;
    font-variant-numeric:tabular-nums;
  }

  .dork-text{ color:var(--text); word-break:break-all; }
  .dork-text .op{ color:var(--teal); font-weight:600; }
  .dork-text .pipe{ color:var(--text-dim); }

  .go{
    margin-left:auto;
    color:var(--text-dim);
    font-size:11px;
    opacity:0;
    transition:opacity .12s ease;
    white-space:nowrap;
    padding-left:10px;
  }
  .line:hover .go{ opacity:1; color:var(--amber-dim); }

  .footer{
    padding:14px 26px 20px;
    border-top:1px solid var(--hairline);
    font-size:11px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
  }
  .footer .tag{ color:var(--amber-dim); }

  @media (max-width:560px){
    .prompt-row{ flex-direction:column; align-items:stretch; }
    .banner{ display:none; }
    .go{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .cursor{ animation:none; opacity:1; }
  }
</style>
</head>
<body>

<div class="crt">
  <div class="titlebar">
    <span class="dot r"></span>
    <span class="dot y"></span>
    <span class="dot g"></span>
    <span class="name"><b>dorker.sh</b> — recon console</span>
    <span class="badge">read-only</span>
  </div>

  <div class="screen">
    <div class="banner">google dork generator — site:, ext:, inurl: query builder for recon</div>

    <div class="prompt-row">
      <span class="prompt-label"><span class="path">dork</span><span class="sym">@</span><span class="path">target</span><span class="sym">:~$</span></span>
      <div class="input-wrap">
        <input id="domain" type="text" value="voorivex.academy" placeholder="enter domain" oninput="updateSearchQuery()" autocomplete="off" spellcheck="false">
        <span class="cursor"></span>
      </div>
    </div>

    <div class="meta-row">
      <span class="count"><b id="dorkCount">0</b> queries generated</span>
      <span>click a line to run in google</span>
    </div>

    <div class="results" id="results"></div>
  </div>

  <div class="footer">
    <span>output opens in a new tab — nothing leaves this page</span>
    <span class="tag">for authorized recon only</span>
  </div>
</div>

<script>
  function highlight(dork){
    return dork
      .replace(/\b(site|ext|inurl|intitle):/g, '<span class="op">$1:</span>')
      .replace(/\|/g, '<span class="pipe">|</span>');
  }

  function updateSearchQuery() {
    var domain = document.getElementById('domain').value.trim();
    var dorks = [
      'site:' + domain + ' inurl:&',
      'site:' + domain + ' ext:php | ext:aspx | ext:asp | ext:jsp | ext:html | ext:htm',
      'site:' + domain + ' ext:log | ext:txt | ext:conf | ext:cnf | ext:ini | ext:env | ext:sh | ext:bak | ext:backup | ext:swp | ext:old | ext:~ | ext:git | ext:svn | ext:htpasswd | ext:htaccess | ext:xml',
      'site:' + domain + ' inurl:url= | inurl:return= | inurl:next= | inurl:redir= inurl:http',
      'site:' + domain + ' inurl:http | inurl:url= | inurl:path= | inurl:dest= | inurl:html= | inurl:data= | inurl:domain= | inurl:page= inurl:&',
      'site:' + domain + ' inurl:config | inurl:env | inurl:setting | inurl:backup | inurl:admin | inurl:php',
      'site:' + domain + ' inurl:email= | inurl:phone= | inurl:password= | inurl:secret= inurl:&',
      'site:' + domain + ' inurl:apidocs | inurl:api-docs | inurl:swagger | inurl:api-explorer',
      'site:' + domain + ' inurl:cmd | inurl:exec= | inurl:query= | inurl:code= | inurl:do= | inurl:run= | inurl:read= | inurl:ping= inurl:&',
      'site:' + domain + ' inurl:(unsubscribe|register|feedback|signup|join|contact|profile|user|comment|api|developer|affiliate|upload|mobile|upgrade|password)',
      'site:' + domain + ' intitle:"Welcome to Nginx"',
    ];

    var resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';
    document.getElementById('dorkCount').textContent = dorks.length;

    dorks.forEach(function (dork, i) {
      var link = 'https://www.google.com/search?q=' + encodeURIComponent(dork);

      var a = document.createElement('a');
      a.href = link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'line';

      var ln = document.createElement('span');
      ln.className = 'ln';
      ln.textContent = String(i + 1).padStart(2, '0');

      var text = document.createElement('span');
      text.className = 'dork-text';
      text.innerHTML = highlight(dork);

      var go = document.createElement('span');
      go.className = 'go';
      go.textContent = 'run →';

      a.appendChild(ln);
      a.appendChild(text);
      a.appendChild(go);
      resultsDiv.appendChild(a);
    });
  }

  updateSearchQuery();
</script>

</body>
</html>
